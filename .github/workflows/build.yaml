name: Build Executable

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-13          # Intel
            platform: macos
            arch: x64
          - os: macos-14          # Apple Silicon
            platform: macos
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Linux 上 tkinter 不是默认装的，不装 pyinstaller 会打出一个开不了的包
      - name: Install system Tk (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      # pywebview 在 Linux 上走 GTK/WebKit
      - name: Install WebKit (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y libgirepository1.0-dev gir1.2-webkit2-4.1 python3-gi

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # .mo 是从 lang/source/*.json 生成的，不进版本库，打包前必须先编译出来
      - name: Compile translations
        run: python tools/lang_build.py

      # 翻译检查只做体检，不卡构建。
      #
      # tools/lang_check.py 一发现缺键就退 1。繁體中文是基于旧键集翻的，
      # 之后新增的 13 个键它没跟上，于是这一步把 windows / macos x64 /
      # macos arm64 / linux 四个平台的构建全拦在了 Build 之前。
      #
      # 但 i18n 运行时本来就会把缺的键回退成英文，程序照常能用 ——
      # 社区翻译跟不上新功能是常态，不该让发布停摆。
      # continue-on-error 保留了这一步的诊断价值（日志里照样能看到缺哪些键、
      # job 上会有黄色标记），只是不再让它决定构建成败。
      - name: Check translations
        continue-on-error: true
        run: python tools/lang_check.py

      - name: Build
        run: pyinstaller --noconfirm LitematicaViewer.spec

      - name: Package macOS app
        if: matrix.platform == 'macos'
        run: |
          cd dist
          hdiutil create -volname LitematicaViewer -srcfolder LitematicaViewer.app \
            -ov -format UDZO LitematicaViewer-${{ matrix.arch }}.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LitematicaViewer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/LitematicaViewer
